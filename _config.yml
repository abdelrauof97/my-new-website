# RealtorToThrive
# Jekyll configuration. Restart `jekyll serve` after editing this file.

title: RealtorToThrive
tagline: Your business isn't generic. Your website shouldn't be either.
description: Custom real estate websites, expert platform migrations, and performance-driven development for established agents, teams, and brokerages in the United States.
email: rauof@realtortothrive.com
url: "https://www.realtortothrive.com"
# Used for canonical, Open Graph, and sitemap links. Kept separate from `url`
# because `jekyll serve` and some hosts replace `url` with the local host.
canonical_host: "https://www.realtortothrive.com"
baseurl: ""
lang: en-US
author: RealtorToThrive

# Consultation form.
# Leave form_endpoint blank to use the mailto handoff: the form opens the
# visitor's email app with the inquiry addressed to `email`. That path is
# real, but it depends on the visitor having a mail client.
# To deliver on the server, set form_endpoint to a full HTTPS URL from your
# provider (for example Formspree). The form then POSTs these fields:
# name, email, company, website, platform, service, details.
# Do not point this at a placeholder URL. An empty value is the honest default.
form_endpoint: ""

social:
  instagram: https://www.instagram.com/realtortothrive1/
  facebook: https://web.facebook.com/profile.php?id=61581181315979

permalink: pretty

collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
  blog:
    output: true
    permalink: /blog/:path/

plugins:
  - jekyll-feed

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio

include:
  - .htaccess
  - CNAME

exclude:
  - vendor
  - .bundle
  - tmp
  - _legacy
  - node_modules
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
