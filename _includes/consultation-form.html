{% comment %}
  Netlify Forms parses this markup at deploy time.
  The form name, the hidden form-name field, and every input must stay in the
  published HTML. Submissions are stored only when the site is deployed on Netlify.
{% endcomment %}
<form
  class="inquiry"
  id="consultation"
  name="contact"
  method="POST"
  action="{{ '/thank-you/' | relative_url }}"
  netlify
  data-netlify="true"
  netlify-honeypot="company_website_confirm"
>
  <input type="hidden" name="form-name" value="contact">

  <div class="hp" aria-hidden="true">
    <label>Leave this field empty <input name="company_website_confirm" tabindex="-1" autocomplete="off"></label>
  </div>

  <div class="inquiry__grid">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="company">Company or brokerage</label>
      <input id="company" name="company" type="text" autocomplete="organization">
    </div>
    <div class="field">
      <label for="website">Current website URL</label>
      <input id="website" name="website" type="url" inputmode="url" placeholder="https://" autocomplete="url">
    </div>
    <div class="field">
      <label for="platform">Current platform</label>
      <select id="platform" name="platform">
        <option value="">Select a platform</option>
        <option>Real Geeks</option>
        <option>BoomTown</option>
        <option>Sierra Interactive</option>
        <option>Luxury Presence</option>
        <option>WordPress</option>
        <option>Other</option>
        <option>Not sure</option>
      </select>
    </div>
    <div class="field">
      <label for="service">Service interested in</label>
      <select id="service" name="service" required>
        <option value="">Select a service</option>
        <option>Custom website design</option>
        <option>Website migration</option>
        <option>Performance development</option>
        <option>SEO and PPC architecture</option>
        <option>Website audit</option>
        <option>Not sure yet</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="details">Project details</label>
    <textarea id="details" name="details" rows="6" required></textarea>
  </div>

  <button class="btn btn--dark" type="submit">Book a Strategy Consultation</button>
</form>
