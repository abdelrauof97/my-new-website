<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" data-header>
  <div class="site-header__bar">
    <a class="wordmark" href="{{ '/' | relative_url }}">RealtorToThrive</a>
    <nav class="desktop-nav" aria-label="Primary">
      <ul>
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
    <a class="btn btn--primary header-cta" href="{{ '/contact/' | relative_url }}">Book a Consultation</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-panel" data-nav-toggle>
      <span class="sr-only">Open menu</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>
  </div>
  <div id="nav-panel" class="nav-panel" data-nav-panel hidden>
    <nav aria-label="Mobile">
      <ul>
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
      <a class="btn btn--primary nav-panel__cta" href="{{ '/contact/' | relative_url }}">Book a Consultation</a>
    </nav>
  </div>
</header>
